info:
  name: Metrics - Prometheus
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/metrics
  auth: inherit

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Métricas Prometheus

  Retorna as métricas operacionais da API no formato Prometheus.

  **Endpoint:** `GET /metrics`

  Inclui contadores de requisições, latência, cache, fila de inferência,
  classificações e estado do modelo. Não envie dados de imagem neste endpoint.

