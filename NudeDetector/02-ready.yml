info:
  name: Ready - serviço pronto
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/ready
  auth: inherit

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Readiness check

  Indica se o ONNX Runtime foi inicializado, o modelo foi carregado e o
  warm-up foi concluído.

  **Endpoint:** `GET /ready`

  ```json
  {"ready": true, "model": true}
  ```

  Use este endpoint no health check de um balanceador ou orquestrador.

